# 工单服务部署到 Cloudflare Workers（免费额度）：D1 存工单，R2 存截图
name = "sparkai-tickets"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# 工单服务自己的域名（走 Cloudflare）。主站 ai.sparkai.si 是灰云直连源站，
# 由源站 OpenResty 把 /ticket-api/ 反代到这里，前台地址不变。
routes = [{ pattern = "ticket.sparkai.si", custom_domain = true }]

[vars]
NEW_API_BASE = "https://ai.sparkai.si"
MAX_IMAGE_BYTES = "1048576"

[[d1_databases]]
binding = "DB"
database_name = "sparkai-tickets"
database_id = "acaeb9cd-f1e0-4c3b-baef-0d652c294792"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "sparkai-tickets"

# 每小时清理一次上传后没发出去的图片
[triggers]
crons = ["17 * * * *"]
